<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소공간용 소화용구 모델 선정</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
  :root {
    --bg: #0a0a0a;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #333333;
    --accent: #D0FE17;
    --accent2: #D0FE17;
    --text: #e8eaf0;
    --text-muted: #7a7a7a;
    --text-dim: #444444;
    --mono: 'DM Mono', monospace;
    --sans: 'Noto Sans KR', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }
  .header { text-align: center; margin-bottom: 48px; }
  .header .badge {
    display: inline-block;
    background: rgba(208,254,23,0.1);
    border: 1px solid rgba(208,254,23,0.35);
    color: var(--accent2);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 2px;
    margin-bottom: 20px;
  }
  .header .logo-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
  }
  .header .logo-wrap img {
    height: 48px;
    width: auto;
    display: block;
  }
  .header p {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 300;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 100%;
    max-width: 640px;
    overflow: hidden;
  }
  .card-body { padding: 32px 28px; }
  .input-label {
    font-size: 11px;
    font-family: var(--mono);
    color: #e8eaf0;
    letter-spacing: 0.1em;
    margin-bottom: 20px;
  }
  .dims-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 8px;
  }
  .dim-group { display: flex; flex-direction: column; gap: 6px; }
  .dim-group label {
    font-size: 11px;
    color: #e8eaf0;
    font-family: var(--mono);
    letter-spacing: 0.08em;
  }
  .dim-group input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    padding: 10px 12px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }
  .dim-group input::-webkit-outer-spin-button,
  .dim-group input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .dim-group input:focus { border-color: var(--accent); }
  .dim-group input::placeholder { color: rgba(208,254,23,0.35); }
  .unit-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    margin-bottom: 24px;
  }
  .formula-preview {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 13px;
    color: #e8eaf0;
    margin-bottom: 24px;
    min-height: 48px;
  }
  .formula-preview .val { color: var(--text); }
  .unit-toggle {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0;
    margin-bottom: 20px;
  }
  .unit-toggle button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 14px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .unit-toggle button:first-child { border-radius: 4px 0 0 4px; border-right: none; }
  .unit-toggle button:last-child  { border-radius: 0 4px 4px 0; }
  .unit-toggle button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 700;
  }
  .formula-preview .op { color: var(--text-dim); }
  .btn-calc {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 4px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 14px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-calc:hover { background: var(--accent2); }
  .btn-calc:active { transform: scale(0.99); }
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0;
  }
  .result-section { display: none; }
  .result-section.visible { display: block; }
  .result-label {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .volume-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .volume-box .v-label { font-size: 13px; color: var(--text-muted); }
  .volume-box .v-num {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 500;
    color: var(--text);
  }
  .volume-box .v-num span {
    font-size: 14px;
    color: var(--text-muted);
    margin-left: 4px;
  }
  .model-box {
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 20px 20px;
    background: rgba(208,254,23,0.05);
    margin-bottom: 16px;
  }
  .model-box .m-label {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--accent2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .model-box .m-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .model-box .m-name {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .model-box .m-vol {
    font-size: 13px;
    color: var(--text-muted);
    font-family: var(--mono);
    text-align: right;
  }
  .error-box {
    background: rgba(232,71,42,0.1);
    border: 1px solid rgba(232,71,42,0.3);
    border-radius: 6px;
    padding: 14px 18px;
    font-size: 13px;
    color: var(--accent2);
    font-family: var(--mono);
    display: none;
  }
  .error-box.visible { display: block; }
  .footer {
    margin-top: 40px;
    font-size: 12px;
    color: #e8eaf0;
    font-family: var(--mono);
    text-align: center;
  }
  @media (max-width: 480px) {
    .dims-row { gap: 8px; }
    .card-body { padding: 24px 18px; }
  }
</style>
</head>
